<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg1)"/>
  <!-- folhas decorativas -->
  <g opacity="0.15">
    <ellipse cx="120" cy="80" rx="90" ry="45" fill="#95d5b2" transform="rotate(-20 120 80)"/>
    <ellipse cx="1080" cy="320" rx="110" ry="55" fill="#95d5b2" transform="rotate(15 1080 320)"/>
    <ellipse cx="1000" cy="60" rx="60" ry="30" fill="#95d5b2" transform="rotate(30 1000 60)"/>
  </g>
  <!-- camiseta estilizada -->
  <g transform="translate(870,110)">
    <path d="M40 0 L110 0 L150 40 L120 65 L110 50 L110 190 L40 190 L40 50 L30 65 L0 40 Z"
          fill="#95d5b2" stroke="#f1f8f4" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="75" cy="35" r="12" fill="#1b4332"/>
  </g>
  <text x="90" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">EcoTrend</text>
  <text x="90" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#95d5b2">Moda que respeita o planeta</text>
</svg>
